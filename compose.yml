name: identity-platform
x-app-env: &app-env
  NODE_ENV: development
  DATABASE_URL: postgresql://identity:${POSTGRES_PASSWORD:?Run node scripts/configure.mjs}@postgres:5432/identity
  REDIS_URL: redis://:${REDIS_PASSWORD:?Run configure}@redis:6379
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
  ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:8081}
  S3_ENDPOINT: http://object-storage:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: us-east-1
  S3_BUCKET: identity-media
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run configure}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Run configure}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Run configure}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run configure}
  ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-primary}
  ENCRYPTION_PREVIOUS_KEYS: '${ENCRYPTION_PREVIOUS_KEYS:-}'
  ENCRYPTION_LEGACY_KEY: ${ENCRYPTION_LEGACY_KEY:-}
  SMTP_HOST: mail
  SMTP_PORT: 1025
  EMAIL_FROM: ${EMAIL_FROM:-identity@example.test}
  CUSTOM_DOMAIN_TARGET: ${CUSTOM_DOMAIN_TARGET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  RP_ID: ${RP_ID:-localhost}
  MODERATOR_EMAILS: ${MODERATOR_EMAILS:-}
  TRUST_PROXY: 'true'
x-server: &server
  build: { context: ., dockerfile: infrastructure/docker/server.Dockerfile }
  environment: *app-env
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_healthy }
    storage-init: { condition: service_completed_successfully }
services:
  postgres:
    image: identity-platform-postgres
    build: { context: ., dockerfile: infrastructure/docker/postgres.Dockerfile }
    environment:
      {
        POSTGRES_DB: identity,
        POSTGRES_USER: identity,
        POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?Run configure}',
      }
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U identity -d identity'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    restart: unless-stopped
  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command:
      ['redis-server', '--requirepass', '${REDIS_PASSWORD:?Run configure}', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      {
        test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD} ping | grep PONG'],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    restart: unless-stopped
  object-storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -ip=object-storage -master.volumeSizeLimitMB=256
    ports: ['127.0.0.1:9000:9000']
    volumes: [object-data:/data, './data/s3.json:/etc/seaweedfs/s3.json:ro']
    restart: unless-stopped
  storage-init:
    build: { context: ., dockerfile: infrastructure/docker/server.Dockerfile }
    command: ['node', 'scripts/storage-init.mjs']
    environment: *app-env
    depends_on: [object-storage]
    restart: 'no'
  mail:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
    restart: unless-stopped
  migrate:
    build: { context: ., dockerfile: infrastructure/docker/server.Dockerfile }
    command: ['node', 'dist/packages/core/src/migrate.js']
    environment: *app-env
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    restart: 'no'
  api:
    <<: *server
    command: ['node', 'dist/apps/api/src/main.js']
    healthcheck:
      {
        test: ['CMD', 'node', 'scripts/health.mjs', 'http://localhost:4000/health/ready'],
        interval: 10s,
        timeout: 5s,
        retries: 15,
      }
  delivery:
    <<: *server
    command: ['node', 'dist/apps/delivery/src/main.js']
    healthcheck:
      {
        test: ['CMD', 'node', 'scripts/health.mjs', 'http://localhost:4001/health'],
        interval: 10s,
        timeout: 5s,
        retries: 15,
      }
  worker:
    <<: *server
    command: ['node', 'dist/apps/worker/src/main.js']
    healthcheck:
      {
        test: ['CMD', 'node', 'scripts/health.mjs', 'http://localhost:4010/health'],
        interval: 15s,
        timeout: 5s,
        retries: 10,
      }
  scheduler:
    <<: *server
    command: ['node', 'dist/apps/scheduler/src/main.js']
    healthcheck:
      {
        test: ['CMD', 'node', 'scripts/health.mjs', 'http://localhost:4011/health'],
        interval: 15s,
        timeout: 5s,
        retries: 10,
      }
  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile, args: { APP: web } }
    environment:
      {
        INTERNAL_API_KEY: '${INTERNAL_API_KEY}',
        S3_PUBLIC_ENDPOINT: '${S3_PUBLIC_ENDPOINT:-http://localhost:9000}',
        API_INTERNAL_URL: 'http://api:4000',
        PUBLIC_ORIGIN: '${PUBLIC_ORIGIN:-http://localhost:8080}',
      }
    init: true
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      {
        test: ['CMD', 'node', 'scripts/health.mjs', 'http://localhost:3000/'],
        interval: 10s,
        timeout: 5s,
        retries: 15,
      }
  admin:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile, args: { APP: admin } }
    environment:
      {
        API_INTERNAL_URL: 'http://api:4000',
        PUBLIC_ORIGIN: '${ADMIN_ORIGIN:-http://localhost:8081}',
      }
    init: true
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      {
        test: ['CMD', 'node', 'scripts/health.mjs', 'http://localhost:3000/'],
        interval: 10s,
        timeout: 5s,
        retries: 15,
      }
  reverse-proxy:
    image: identity-platform-proxy
    build: { context: ., dockerfile: infrastructure/docker/proxy.Dockerfile }
    ports: ['127.0.0.1:8080:80', '127.0.0.1:8081:81']
    volumes: ['./infrastructure/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro']
    depends_on:
      {
        web: { condition: service_healthy },
        admin: { condition: service_healthy },
        delivery: { condition: service_healthy },
      }
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [observability]
    volumes:
      [
        './infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro',
        './infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro',
        prometheus-data:/prometheus,
      ]
    ports: ['127.0.0.1:9090:9090']
volumes:
  postgres-data:
  redis-data:
  object-data:
  prometheus-data:
