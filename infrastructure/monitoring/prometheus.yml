global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: identity-api
    static_configs: [{targets: ['api:4000']}]
    metrics_path: /metrics
  - job_name: identity-worker
    static_configs: [{targets: ['worker:4010']}]
    metrics_path: /metrics
  - job_name: identity-scheduler
    static_configs: [{targets: ['scheduler:4011']}]
    metrics_path: /metrics
  - job_name: identity-delivery
    static_configs: [{targets: ['delivery:4001']}]
    metrics_path: /metrics
