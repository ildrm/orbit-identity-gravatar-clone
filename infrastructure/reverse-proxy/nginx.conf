events { worker_connections 2048; }
http {
  server_tokens off;
  client_max_body_size 10m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;
  # Omit query strings, referrers, cookies and credentials from access logs.
  log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log safe;
  # Routine upstream failures are observable in access statuses/metrics; nginx
  # error messages cannot redact query strings from request lines.
  error_log /var/log/nginx/error.log crit;
  limit_req_zone $binary_remote_addr zone=delivery:10m rate=30r/s;
  upstream api { zone api_upstream 64k; server api:4000 resolve; }
  upstream delivery { zone delivery_upstream 64k; server delivery:4001 resolve; }
  upstream web { zone web_upstream 64k; server web:3000 resolve; }
  upstream admin { zone admin_upstream 64k; server admin:3000 resolve; }
  server {
    listen 80;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location /api/ { proxy_pass http://api; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host; }
    location /health/ { proxy_pass http://api; }
    location /avatar/ { limit_req zone=delivery burst=60 nodelay; proxy_pass http://delivery; proxy_set_header X-Forwarded-For $remote_addr; }
    location /assets/ { limit_req zone=delivery burst=60 nodelay; proxy_pass http://delivery; }
    location /.well-known/ { proxy_pass http://api; }
    location /q/ { proxy_pass http://api; }
    location / { proxy_pass http://web; proxy_set_header Host $host; proxy_set_header X-Forwarded-Host $host; }
  }
  server {
    listen 81;
    add_header Referrer-Policy no-referrer always;
    location /api/ { proxy_pass http://api; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header Host $host; }
    location / { proxy_pass http://admin; proxy_set_header Host $host; }
  }
}
